[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "imagecropper"
version = "0.1.0"
description = "Download portrait images and crop them into circular/square PNGs focused on faces."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Julius Kooistra" }]
keywords = ["image", "crop", "portrait", "face-detection", "bfh"]
dependencies = [
    "pillow",
    "opencv-python",
    "numpy",
]

[project.urls]
Repository = "https://github.com/juliuskooistra/ImageCropper"

[project.scripts]
imagecropper-crop = "imagecropper.crop_images:cli"
imagecropper-fetch = "imagecropper.find_images:cli"
imagecropper-fetch-bfh = "imagecropper.find_images_bfh:cli"

[tool.setuptools.packages.find]
where = ["src"]
